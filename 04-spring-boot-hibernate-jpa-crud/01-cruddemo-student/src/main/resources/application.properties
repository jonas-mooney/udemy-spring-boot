spring.application.name=cruddemo
spring.datasource.url=jdbc:mysql://localhost:3306/student_tracker
spring.datasource.username=springstudent
spring.datasource.password=springstudent

# Turn off Spring Boot banner
spring.main.banner-mode=off

# Reduce logging level. Set logging level to warn.
logging.level.root=warn

################### DB AUTO GENERATION ###################
# Don't use auto table generation for enterprise, real-time project.
# Just for dev, testing and personal projects.
# Use SQL scripts instead

# Configure JPA/Hibernate to auto create tables (this will drop tables and create tables for entity classes)
#spring.jpa.hibernate.ddl-auto=create

# Configure JPA/Hibernate to auto create the tables (update will keep existing data in the table)
spring.jpa.hibernate.ddl-auto=update

# Add logging configs to display SQL statements
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace